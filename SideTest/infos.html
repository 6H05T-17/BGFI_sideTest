<!DOCTYPE html>
<html>
<body>
    <h2>Registration</h2>
    <!-- action points to the PHP file that will process the data -->
    <form action="process.php" method="POST">
        Prénoms : <input type="text" name="first_name" required><br><br>
        Nom : <input type="text" name="last_name" required><br><br>
        
        Relationship status:
        <select name="relationship">
            <option value="SINGLE">SINGLE</option>
            <option value="COUPLE">COUPLE</option>

        <input type="submit" value="Soumettre">

</body>
</html>
